[project]
name = "financial-advisor"
version = "0.1.0"
description = "A local multi-agent financial-advisory demonstration."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "beautifulsoup4>=4.12,<5.0",
  "fastembed>=0.5,<1.0",
  "fastapi>=0.115,<1.0",
  "google-adk>=1.0,<2.0",
  "greenlet>=3.0,<4.0",
  "lancedb>=0.19,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "pypdf>=5.0,<6.0",
  "pyyaml>=6.0,<7.0",
  "transformers>=4.48,<5.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.14,<2.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.9,<1.0",
  "types-pyyaml>=6.0,<7.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["financial_advisor"]
